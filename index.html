<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رحلة الحروف</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#dff3ff;--ink:#17324d;--teal:#0e7c86;--sun:#ffc93c;--coral:#ff6b6b;--leaf:#3fbf84;--plum:#8e6cef}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font-family:'Cairo','Segoe UI',Tahoma,sans-serif;color:var(--ink);background:var(--bg) radial-gradient(circle at 10% 10%,#fff8 0 80px,transparent 81px),radial-gradient(circle at 90% 85%,#ffe9a8 0 110px,transparent 111px);padding:14px}
.frame{max-width:980px;margin:0 auto;background:#fff;border:6px solid var(--teal);border-radius:28px;box-shadow:0 14px 0 #0e7c8633,0 24px 40px #17324d33;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 20px;background:linear-gradient(90deg,var(--teal),#17a2a8);color:#fff}
header h1{margin:0;font-size:clamp(20px,4vw,32px);font-weight:900}
.stars{background:#fff;color:var(--ink);border-radius:999px;padding:4px 16px;font-weight:900;font-size:20px;box-shadow:inset 0 -4px 0 #0002}
main{padding:18px}
.btn{font:inherit;font-weight:900;border:0;border-radius:18px;padding:10px 20px;font-size:20px;color:#fff;cursor:pointer;background:var(--c,var(--teal));box-shadow:0 6px 0 rgba(0,0,0,.25),0 10px 14px #0003;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:14px;margin-top:14px}
.grid .btn{font-size:44px;padding:8px 0;position:relative}
.grid .btn.done::after{content:"⭐";position:absolute;top:-4px;left:-2px;font-size:20px}
.gt{margin:22px 0 0;display:inline-block;background:var(--sun);border-radius:999px;padding:2px 18px;font-size:18px;box-shadow:0 4px 0 #0002}
h2{margin:0;text-align:center;font-size:clamp(22px,4vw,30px)}
.lesson{display:grid;gap:16px}
.card{border:4px solid #bfe3ee;border-radius:22px;padding:14px;text-align:center;box-shadow:0 6px 0 #bfe3ee}
.big{font-size:min(38vw,230px);line-height:1.1;font-weight:900;color:var(--c);margin:0}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.forms span{display:inline-block;min-width:70px;font-size:48px;font-weight:900;background:#f2fbff;border-radius:14px;padding:2px 10px}
.forms small{display:block;font-size:14px}
.emoji{font-size:90px;line-height:1}
.word{font-size:36px;font-weight:900}
canvas{width:100%;max-width:420px;aspect-ratio:1;border:4px dashed var(--c);border-radius:20px;touch-action:none;background:#fffdf3}
.opts .btn{font-size:70px;padding:10px 26px;background:#fff;box-shadow:0 6px 0 #bfe3ee,0 10px 14px #0002}
.opts .btn.ok{background:#c9f5df}.opts .btn.no{background:#ffd6d6}
.msg{font-size:26px;font-weight:900;min-height:40px}
</style>
</head>
<body>
<div class="frame">
<header><h1>🌟 رحلة الحروف</h1><div class="stars" id="stars">⭐ 0</div></header>
<main id="app"></main>
</div>
<script>
const L=[["أ","أَلِف","أَرْنَب","🐰"],["ب","بَاء","بَطَّة","🦆"],["ت","تَاء","تُفَّاحَة","🍎"],["ث","ثَاء","ثَعْلَب","🦊"],["ج","جِيم","جَمَل","🐪"],["ح","حَاء","حِصَان","🐴"],["خ","خَاء","خَرُوف","🐑"],["د","دَال","دَجَاجَة","🐔"],["ذ","ذَال","ذُرَة","🌽"],["ر","رَاء","رَادِيُو","📻"],["ز","زَاي","زَرَافَة","🦒"],["س","سِين","سَمَكَة","🐟"],["ش","شِين","شَمْس","☀️"],["ص","صَاد","صَارُوخ","🚀"],["ض","ضَاد","ضِفْدَع","🐸"],["ط","طَاء","طَائِرَة","✈️"],["ظ","ظَاء","ظَرْف","✉️"],["ع","عَيْن","عِنَب","🍇"],["غ","غَيْن","غَزَال","🦌"],["ف","فَاء","فِيل","🐘"],["ق","قَاف","قَمَر","🌙"],["ك","كَاف","كِتَاب","📖"],["ل","لَام","لَيْمُون","🍋"],["م","مِيم","مَوْزَة","🍌"],["ن","نُون","نَحْلَة","🐝"],["ه","هَاء","هَدِيَّة","🎁"],["و","وَاو","وَرْدَة","🌹"],["ي","يَاء","يَد","✋"]];
const COL=["#0e7c86","#ff6b6b","#3fbf84","#8e6cef","#f59e0b","#2f80ed"];
const NOJOIN="ادذرزو";
// ترتيب المنهج: عدّل هذا السطر فقط. الأرقام = موضع الحرف في القائمة L أعلاه (أ=0، ب=1 ... ي=27)
// ملفات الصوت مرتبطة بالحرف نفسه فلا تحتاج لإعادة توليدها عند تغيير الترتيب
const GROUPS=[["المجموعة ١",[0,1,2,3]],["المجموعة ٢",[4,5,6]],["المجموعة ٣",[7,8,9,10]],["المجموعة ٤",[11,12,13,14]],["المجموعة ٥",[15,16,17,18]],["المجموعة ٦",[19,20,21,22]],["المجموعة ٧",[23,24,25,26,27]]];
const ORDER=GROUPS.flatMap(g=>g[1]);
const S=JSON.parse(localStorage.getItem("hurouf")||'{"stars":0,"done":[]}');
const save=()=>{try{localStorage.setItem("hurouf",JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id), app=$("app");
const pad=i=>String(i+1).padStart(2,"0");
let cur=null;
// الصوت: ملف mp3 من مجلد audio، وإن لم يوجد يُستخدم صوت المتصفح
function say(file,text){
  speechSynthesis.cancel();
  const a=new Audio("audio/"+file+".mp3");
  a.onerror=()=>{const u=new SpeechSynthesisUtterance(text);u.lang="ar-EG";u.rate=.7;speechSynthesis.speak(u)};
  a.play().catch(()=>{});
}
const star=n=>{S.stars+=n;save();$("stars").textContent="⭐ "+S.stars};
function home(){
  app.innerHTML='<h2>اختر حرفاً لتتعلمه</h2>'+GROUPS.map(([t,ids])=>`<h3 class="gt">${t}</h3><div class="grid">`+ids.map(i=>`<button class="btn ${S.done.includes(i)?"done":""}" style="--c:${COL[i%6]}" onclick="lesson(${i})" aria-label="${L[i][1]}">${L[i][0]}</button>`).join("")+'</div>').join("")+'<p class="row" style="margin-top:20px"><button class="btn" style="--c:#f59e0b" onclick="quiz()">🎮 لعبة الصور</button></p>';
  $("stars").textContent="⭐ "+S.stars;
}
function lesson(i){
  cur=i;const [ch,nm,w,em]=L[i],c=COL[i%6],j="\u200D",nj=NOJOIN.includes(ch),nx=ORDER[ORDER.indexOf(i)+1];
  const forms=[["منفصل",ch],["أول",nj?ch:ch+j],["وسط",nj?j+ch:j+ch+j],["آخر",j+ch]];
  app.innerHTML=`<div class="lesson" style="--c:${c}">
  <div class="card"><p class="big">${ch}</p><h2>${nm}</h2>
   <div class="row" style="margin-top:12px"><button class="btn" onclick="say('l${pad(i)}_name','${nm}')">🔊 الاسم</button>
   <button class="btn" style="--c:var(--coral)" onclick="say('l${pad(i)}_fatha','${ch}َ')">${ch}َ</button>
   <button class="btn" style="--c:var(--leaf)" onclick="say('l${pad(i)}_damma','${ch}ُ')">${ch}ُ</button>
   <button class="btn" style="--c:var(--plum)" onclick="say('l${pad(i)}_kasra','${ch}ِ')">${ch}ِ</button></div></div>
  <div class="card"><button class="btn" style="--c:var(--sun);color:var(--ink);background:#fff;box-shadow:0 6px 0 #bfe3ee" onclick="say('l${pad(i)}_word','${w}')"><div class="emoji">${em}</div><div class="word">${w}</div></button></div>
  <div class="card forms row">${forms.map(f=>`<div><span>${f[1]}</span><small>${f[0]}</small></div>`).join("")}</div>
  <div class="card"><h2>تتبّع الحرف بإصبعك</h2><canvas id="cv" width="420" height="420"></canvas>
   <p class="row"><button class="btn" style="--c:var(--coral)" onclick="trace('${ch}')">🧽 امسح</button></p></div>
  <div class="row">
   <button class="btn" style="--c:#64748b" onclick="home()">🏠 الرئيسية</button>
   <button class="btn" style="--c:var(--leaf)" onclick="finish(${i})">✅ أتقنت الحرف</button>
   ${nx!==undefined?`<button class="btn" onclick="lesson(${nx})">التالي ◀</button>`:""}</div></div>`;
  trace(ch);setTimeout(()=>say("l"+pad(i)+"_name",nm),300);
}
function finish(i){if(!S.done.includes(i)){S.done.push(i);star(3)}say("good","أَحْسَنْت");home()}
function trace(ch){
  const cv=$("cv"),x=cv.getContext("2d");x.clearRect(0,0,420,420);
  x.font="900 300px Cairo,sans-serif";x.textAlign="center";x.textBaseline="middle";x.fillStyle="#17324d18";x.fillText(ch,210,230);
  x.strokeStyle=COL[cur%6];x.lineWidth=18;x.lineCap=x.lineJoin="round";let d=false;
  const p=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*420/r.width,(e.clientY-r.top)*420/r.height]};
  cv.onpointerdown=e=>{d=true;const[a,b]=p(e);x.beginPath();x.moveTo(a,b);cv.setPointerCapture(e.pointerId)};
  cv.onpointermove=e=>{if(!d)return;const[a,b]=p(e);x.lineTo(a,b);x.stroke()};
  cv.onpointerup=()=>d=false;
}
// لعبة: ما الصورة التي تبدأ بهذا الحرف؟
let q=0;
function quiz(){
  const i=Math.floor(Math.random()*28),o=new Set([i]);
  while(o.size<3)o.add(Math.floor(Math.random()*28));
  const opts=[...o].sort(()=>Math.random()-.5);
  app.innerHTML=`<div class="lesson"><h2>أيّ صورة تبدأ بحرف</h2><div class="card"><p class="big" style="--c:${COL[i%6]};font-size:150px">${L[i][0]}</p>
  <button class="btn" onclick="say('l${pad(i)}_name','${L[i][1]}')">🔊 اسمع الحرف</button></div>
  <div class="row opts">${opts.map(k=>`<button class="btn" onclick="pick(this,${k},${i})">${L[k][3]}</button>`).join("")}</div>
  <div class="msg" id="msg" style="text-align:center"></div>
  <p class="row"><button class="btn" style="--c:#64748b" onclick="home()">🏠 الرئيسية</button></p></div>`;
  say("l"+pad(i)+"_name",L[i][1]);
}
function pick(b,k,i){
  if(k===i){b.classList.add("ok");$("msg").textContent="🎉 أحسنت! "+L[i][2];star(1);say("good","أَحْسَنْت");setTimeout(quiz,1400)}
  else{b.classList.add("no");$("msg").textContent="حاول مرة أخرى 💪";say("retry","حَاوِلْ مَرَّةً أُخْرَى")}
}
home();
</script>
</body>
</html>
